version: '3'

dotenv:
  - .env

interval: 500ms

tasks:
  build:
    cmds:
      - go build -v ./...

  watch:
    cmds:
      - go install
    sources:
      - '**/*.go'
    watch: true

  example-apply:
    cmds:
      - terraform plan
      - terraform apply
    dir: examples/provider

  example-destroy:
    cmds:
      - terraform destroy
    dir: examples/provider

  example-import:
    cmds:
      - ketryx_project_id=$(terraform state show ketryx_project.test | grep id | awk '{print $3}' | tr -d '"')
      - terraform state rm ketryx_project.test
      - terraform import ketryx_project.test $ketryx_project_id
      - terraform plan
    dir: examples/provider

  deps:
    cmds:
      - go mod verify
      - go mod tidy

  test:
    cmds:
      - go test ./...

  format:
    cmds:
      - go fmt ./...

  vet:
    cmds:
      - go vet ./...

  race:
    cmds:
      - go test -race -v ./...

  check:
    cmds:
      - task: build
      - task: deps
      - task: vet
      - task: test
      - task: race

  clean:
    cmds:
      - rm -rf dist
